<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя 💖</title>
<style>
:root{
  --bg1:#ffe3ec; --bg2:#ffd0e0; --text:#5a1a35; --accent:#ff4d85; --accent2:#ff7aa8; --card:rgba(255,255,255,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0f1e; --bg2:#4a1530; --text:#ffe3ec; --accent:#ff5c93; --accent2:#ff8db3; --card:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --bg1:#2a0f1e; --bg2:#4a1530; --text:#ffe3ec; --accent:#ff5c93; --accent2:#ff8db3; --card:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden; display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.stage{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:24px; text-align:center; opacity:0; pointer-events:none; transition:opacity .6s ease; z-index:2}
.stage.on{opacity:1; pointer-events:auto}
h1{font-size:clamp(26px,7vw,40px); margin:0; font-weight:700; line-height:1.2}
.big{font-size:clamp(44px,13vw,88px); font-weight:800; color:var(--accent); min-height:1.2em;
  text-shadow:0 4px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.big .cur{display:inline-block; width:3px; background:var(--accent); margin-left:4px; animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
p{margin:0; font-size:clamp(16px,4.5vw,20px); opacity:.85}
.row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center}
button{font:inherit; font-size:18px; font-weight:600; border:0; border-radius:999px; padding:14px 30px; cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease}
.yes{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.yes:active{transform:scale(.95)}
.no{background:var(--card); color:var(--text); backdrop-filter:blur(6px)}
.hint{font-size:14px; opacity:.6}
.heart{position:fixed; pointer-events:none; z-index:1; will-change:transform,opacity; animation:fly linear forwards}
@keyframes fly{
  from{transform:translate(0,0) scale(.6) rotate(0); opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r)); opacity:0}
}
.ambient{position:fixed; bottom:-40px; pointer-events:none; z-index:0; animation:up linear infinite; opacity:.5}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg); opacity:0}}
</style>
</head>
<body>

<section class="stage on" id="s1">
  <h1>Привет 👋<br>Хочешь узнать кое-что?</h1>
  <div class="row">
    <button class="yes" id="yes">Да 💌</button>
    <button class="no" id="no">Нет</button>
  </div>
</section>

<section class="stage" id="s2">
  <div class="big" id="typed"></div>
  <p id="sub" style="opacity:0; transition:opacity .8s">Это чистая правда ✨</p>
  <div class="hint" id="hint" style="opacity:0; transition:opacity .8s">Касайся экрана — там сюрприз</div>
</section>

<script>
const $ = id => document.getElementById(id);
const emojis = ["💖","💗","💕","✨","🌸","💘"];

function show(id){
  document.querySelectorAll(".stage").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
}

function burst(x, y, n = 14){
  for(let i = 0; i < n; i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*140;
    h.style.left = x + "px"; h.style.top = y + "px";
    h.style.fontSize = (16 + Math.random()*22) + "px";
    h.style.setProperty("--dx", Math.cos(a)*d + "px");
    h.style.setProperty("--dy", Math.sin(a)*d - 60 + "px");
    h.style.setProperty("--r", (Math.random()*90 - 45) + "deg");
    h.style.animationDuration = (1.1 + Math.random()*0.9) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2200);
  }
}

function ambient(){
  const h = document.createElement("div");
  h.className = "ambient";
  h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left = Math.random()*100 + "vw";
  h.style.fontSize = (14 + Math.random()*20) + "px";
  h.style.animationDuration = (6 + Math.random()*6) + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 12500);
}
setInterval(ambient, 700);

// Кнопка «Нет» убегает
const no = $("no");
let noTries = 0;
function dodge(e){
  if(e) e.preventDefault();
  noTries++;
  no.style.position = "fixed";
  no.style.zIndex = 5;
  const w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = Math.random()*(innerWidth - w - 20) + 10 + "px";
  no.style.top  = Math.random()*(innerHeight - h - 20) + 10 + "px";
  if(noTries === 4) no.textContent = "Ну пожалуйста 🥺";
  if(noTries === 8) no.textContent = "Не поймаешь 😏";
}
no.addEventListener("pointerenter", dodge);
no.addEventListener("touchstart", dodge, {passive:false});
no.addEventListener("click", dodge);

// «Да» → печатаем «Ты красивая»
$("yes").addEventListener("click", e => {
  show("s2");
  burst(e.clientX, e.clientY, 18);
  const text = "Ты красивая", el = $("typed");
  let i = 0;
  el.innerHTML = '<span class="cur">&nbsp;</span>';
  const t = setInterval(() => {
    i++;
    el.innerHTML = text.slice(0, i) + (i < text.length ? '<span class="cur">&nbsp;</span>' : "");
    if(i >= text.length){
      clearInterval(t);
      burst(innerWidth/2, innerHeight/2.6, 30);
      setTimeout(() => $("sub").style.opacity = 1, 300);
      setTimeout(() => $("hint").style.opacity = 1, 900);
    }
  }, 130);
});

// Сердечки по касанию
document.addEventListener("pointerdown", e => {
  if(!$("s2").classList.contains("on")) return;
  burst(e.clientX, e.clientY, 8);
});

</script>
</body>
</html>
